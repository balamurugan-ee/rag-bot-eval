name: Eval Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prompts/**"
      - "tests/**"
      - "scripts/**"
      - "knowledge-base/**"
      - "promptfoo.classify.yaml"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/eval-pipeline.yml"
      - ".github/actions/setup-and-start/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "prompts/**"
      - "tests/**"
      - "scripts/**"
      - "knowledge-base/**"
      - "promptfoo.classify.yaml"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/eval-pipeline.yml"
      - ".github/actions/setup-and-start/action.yml"
  workflow_dispatch: {}

jobs:
  classifyeval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup and start server
        uses: ./.github/actions/setup-and-start
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          install-promptfoo: 'true'

      - name: Run classification eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p outputs
          promptfoo eval -c promptfoo.classify.yaml --no-cache -o outputs/promptfoo_results.json
          cp outputs/promptfoo_results.json promptfoo-classification-results.json
      
      - name: Generate confusion matrix
        if: always()
        run: python scripts/build_confusion_matrix.py --input outputs/promptfoo_results.json

      - name: Check quality gate (90%)
        run: python scripts/check_promptfoo_threshold.py promptfoo-classification-results.json

      - name: Upload classification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-results
          path: |
            promptfoo-classification-results.json
            outputs/confusion_matrix.png
          retention-days: 10

  rageval:
    needs: classifyeval
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup and start server
        uses: ./.github/actions/setup-and-start
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          install-promptfoo: 'false'

      - name: Download classification results
        uses: actions/download-artifact@v4
        with:
          name: classification-results

      - name: Run RAG eval (70% threshold)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAG_MAX_PARALLEL: "5"
          RAG_RETRIEVAL_K: "2"
          RAG_SAMPLE_SIZE: ${{ github.event_name == 'pull_request' && '8' || '' }}
        run: python scripts/ragas_rag_eval.py

      - name: Upload RAG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-results
          path: |
            tests/ragas_results.json
            tests/ragas_report.html
          retention-days: 30

      - name: Generate pipeline summary
        if: always()
        run: python scripts/write_pipeline_summary.py

  deploy:
    needs: [classifyeval, rageval]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        run: echo "Quality gates passed - ready for deployment"
