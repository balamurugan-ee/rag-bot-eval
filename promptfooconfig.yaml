description: "Riverside Hospital chatbot - promptfoo demo"

prompts:
  - "{{message}}"

providers:
  - id: http://localhost:8000/chat
    label: chatbot
    config:
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: "{{message}}"
      transformResponse: "json"

tests: []
  # RAG groundedness suite (tests/03_rag_groundedness.yaml) needs to be rebuilt --
  # it was removed independently of this cleanup. /chat is now a pure RAG
  # endpoint (no department field), so a fresh suite can target it cleanly.
